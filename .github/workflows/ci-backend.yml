name: ci-backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/ci-backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/ci-backend.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles, checks formatting, then runs unit, property, Testcontainers and
      # ArchUnit suites. The runner's Docker daemon backs Testcontainers; there is
      # no H2 fallback (docs/07-testing.md §7.1).
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: backend/target/*-reports/TEST-*.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco
          path: backend/target/site/jacoco/
