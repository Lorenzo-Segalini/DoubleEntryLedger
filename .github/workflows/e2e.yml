name: e2e

# Triggers on either side, unlike the other workflows. Catching the case where
# frontend and backend drift apart is its entire purpose, so a path filter would
# defeat it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Start the stack
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/compose.yaml up -d --build --wait

      # Against a real backend and a real PostgreSQL, never mocks: the status
      # codes and the append-only behaviour these assert only mean something if
      # the database triggers are the ones enforcing them.
      - name: Run end-to-end tests
        env:
          E2E_BASE_URL: http://localhost:5173
        run: pnpm --filter frontend exec playwright test --workers=1

      - name: Backend logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs backend | tail -200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
