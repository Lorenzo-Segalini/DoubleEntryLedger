app = "double-entry-ledger"
primary_region = "fra"

[build]
  # Overridden by `flyctl deploy --image ghcr.io/...:<sha>` from CI.
  dockerfile = "../backend/Dockerfile"

[deploy]
  # Flyway runs on a one-off machine before any new instance takes traffic.
  # A failed migration aborts the deploy and the previous version keeps serving.
  release_command = "java -cp /app org.flywaydb.core.Flyway migrate"
  strategy = "rolling"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/actuator/health/readiness"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
