spring:
  application:
    name: double-entry-ledger

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DATABASE_USER:ledger}
    password: ${DATABASE_PASSWORD:ledger}
    hikari:
      # Neon's free tier is modest and the app scales to zero; a small pool with a
      # short idle timeout is a better fit than the default 10 held-open connections.
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Migrations connect as a separate role with DDL rights; the application role
    # holds no UPDATE/DELETE on the journal tables. See docs/02-data-model.md §2.6.
    url: ${DATABASE_MIGRATION_URL:${spring.datasource.url}}
    user: ${DATABASE_MIGRATION_USER:${spring.datasource.username}}
    password: ${DATABASE_MIGRATION_PASSWORD:${spring.datasource.password}}

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      # Jackson otherwise coerces 125.50 into a long by truncating it to 125.
      # For a field holding minor units that is money silently lost, which is the
      # entire failure mode ADR-0002 exists to prevent. Reject it instead.
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html

ledger:
  # Reporting/formatting default only. Every amount carries its own currency;
  # this never influences stored data. See ADR-0002.
  default-currency: EUR
  idempotency:
    ttl: PT24H
    sweep-interval: PT15M
  jwt:
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    sweep-interval: PT1H
    issuer: double-entry-ledger
    # Base64 PKCS#8 RSA private key. Absent in development, where an ephemeral
    # key is generated at startup — which invalidates every token on restart.
    private-key: ${JWT_PRIVATE_KEY:}
    # Only ever false for local development over plain HTTP.
    cookie-secure: ${JWT_COOKIE_SECURE:true}

  demo:
    # Off by default: an environment that has not opted in must not acquire
    # accounts whose passwords are published in the README.
    seed-users: ${DEMO_SEED_USERS:false}
    operator-password: ${DEMO_OPERATOR_PASSWORD:}
    auditor-password: ${DEMO_AUDITOR_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    dev.lseg.ledger: ${LOG_LEVEL:INFO}
