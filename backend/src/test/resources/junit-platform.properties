# Randomise method order, and report the seed.
#
# JUnit's default is a deterministic hash of the method names — deterministic for
# a given JVM, and *not* stable across JVM builds. An order-dependent test
# therefore passes locally and fails in CI on a different patch release, which is
# exactly what happened to AuthApiIT: two tests each wrote a DENIED audit row, and
# whichever ran second saw a count of two.
#
# Random ordering does not create that fragility, it exposes it. The seed is
# printed on every run, so a failure is reproducible by pinning
# -Djunit.jupiter.execution.order.random.seed=<seed>.
#
# The rule this enforces: a test asserts about what it did, not about the state it
# happened to inherit. Where shared state cannot be cleared — audit_event is
# append-only by design — assert from a watermark instead.
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer$Random

# Classes too: the same argument applies one level up.
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$Random
